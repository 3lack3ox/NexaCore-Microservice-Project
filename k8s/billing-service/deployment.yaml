apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: billing-service
  namespace: nexacore
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      serviceAccountName: nexacore-sa
      containers:
        - name: billing-service
          image: nexacoreregistry.azurecr.io/billing-service:v1
          ports:
            - containerPort: 3003
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: NODE_ENV
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_NAME_BILLING
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: AUTH_SERVICE_URL
            - name: PAYMENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: PAYMENTS_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
              initialDelaySeconds: 10
              periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
              initialDelaySeconds: 15
              periodSeconds: 20  
  