apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync
  namespace: nexacore
  labels:
    app: secret-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secret-sync
  template:
    metadata:
      labels:
        app: secret-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: nexacore-sa
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: nexacore-secret-provider
      containers:
        - name: secret-sync
          image: busybox
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "20m"