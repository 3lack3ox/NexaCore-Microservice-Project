apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexacore
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: nexacore-sa
      containers:
        - name: auth-service
          image: nexacoreregistry.azurecr.io/auth-service:v1
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: NODE_ENV
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_NAME_AUTH
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: JWT_EXPIRES_IN
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20