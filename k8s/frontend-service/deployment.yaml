apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: frontend-service
  namespace: nexacore
  labels:
    app: frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      serviceAccountName: nexacore-sa
      containers:
        - name: frontend-service
          image: nexacoreregistry.azurecr.io/frontend-service:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              initialDelaySeconds: 10
              periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              initialDelaySeconds: 15
              periodSeconds: 20  
  