apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: notifications-service
  namespace: nexacore
  labels:
    app: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      serviceAccountName: nexacore-sa
      containers:
        - name: notifications-service
          image: nexacoreregistry.azurecr.io/notifications-service:v1
          ports:
            - containerPort: 3005
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: PORT
              value: "3005"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: NODE_ENV
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: DB_NAME_NOTIFICATIONS
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: nexacore-secrets
                  key: SMTP_PASS
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: EMAIL_FROM
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: AUTH_SERVICE_URL
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: nexacore-config
                  key: SMTP_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 20  
  